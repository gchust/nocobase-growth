name: NocoBase growth report

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight checks configuration; report collects data and uses the model.
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - report
      as_of:
        description: Optional GSC cutoff date (YYYY-MM-DD); leave empty for latest finalized data.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nocobase-growth-production
  cancel-in-progress: false

jobs:
  growth:
    name: Generate private growth report
    if: >-
      github.repository == 'gchust/nocobase-growth'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
        || (github.event_name == 'schedule' && vars.GROWTH_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: growth-production
    env:
      AS_OF: ${{ inputs.as_of || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Set temporary work directory
        run: printf 'GROWTH_WORK_DIR=%s/nocobase-growth\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # This installation happens before any business data is collected and has
      # no Google, DeepSeek, or reports credential in its process environment.
      - name: Install pinned Claude Code
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'report' }}
        run: npm install --global --no-audit --no-fund --registry=https://registry.npmjs.org @anthropic-ai/claude-code@2.1.296

      - name: Check destination and credential presence
        env:
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
          GOOGLE_CREDENTIALS_PRESENT: ${{ secrets.GOOGLE_CREDENTIALS_JSON != '' }}
          DEEPSEEK_API_KEY_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: node src/cli.mjs preflight

      - name: Prepare verified private run
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'report' }}
        env:
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
        run: node src/cli.mjs prepare

      - name: Collect Google metrics and public page checks
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'report' }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: node src/cli.mjs collect

      - name: Analyze and render private report
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'report' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node src/cli.mjs analyze

      - name: Archive report in verified private repository
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'report' }}
        env:
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
        run: node src/cli.mjs publish

      # Generation failures archive a safe status record. A publication failure
      # retries the already generated bytes, without another model invocation.
      - name: Preserve failed run or retry publication
        if: ${{ failure() && (github.event_name == 'schedule' || inputs.mode == 'report') }}
        env:
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
        run: node src/cli.mjs failure

      - name: Remove private temporary files
        if: ${{ always() }}
        run: rm -rf -- "$GROWTH_WORK_DIR"
